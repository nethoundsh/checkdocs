services:
  server:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}

  scrape:
    build: .
    entrypoint: ["/app/scraper"]
    command: ["-db", "/app/data/docs.db"]
    volumes:
      - ./data:/app/data
    profiles: ["init"]

  research-sync:
    build:
      context: .
      target: research-sync-runner
    volumes:
      - ./data:/app/data
    profiles: ["research"]
