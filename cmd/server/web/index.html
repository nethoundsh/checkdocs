<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>checkdocs · VulnCheck docs assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
  :root {
    /* backgrounds */
    --bg-page:       #0a0e17;
    --bg-card:       #111827;
    --bg-card-hover: #1a2234;
    --bg-elevated:   #1a2234;
    --bg-terminal:   #0d1117;
    --bg-inset:      rgba(255,255,255,0.025);

    /* text */
    --fg:            #e2e8f0;
    --fg-dim:        #94a3b8;
    --fg-muted:      #64748b;
    --text-numeric:  #f1f5f9;

    /* accents */
    --accent-primary:        #8b7cf6;
    --accent-primary-hover:  #a78bfa;
    --accent-primary-muted:  rgba(139,124,246,0.15);
    --accent-primary-border: rgba(139,124,246,0.30);
    --accent-success:        #10b981;
    --accent-success-hover:  #34d399;
    --accent-warning:        #f59e0b;
    --accent-error:          #f87171;
    --accent-error-bg:       rgba(239,68,68,0.10);

    /* borders */
    --border:         rgba(255,255,255,0.08);
    --border-subtle:  rgba(255,255,255,0.08);
    --border-default: rgba(255,255,255,0.12);

    /* typography */
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-page); color: var(--fg);
    font-family: var(--sans);
    font-size: 15px; line-height: 1.65;
  }
  body { min-height: 100vh; display: flex; flex-direction: column; }

  /* ─── Header ─────────────────────────────────────────────── */
  header {
    background: var(--bg-card);
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; height: 52px; flex-shrink: 0;
  }
  .logo {
    margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
    color: var(--fg); white-space: nowrap; font-family: var(--sans);
  }
  .logo .brand { color: var(--accent-primary); }
  .logo .subtitle { color: var(--fg-muted); font-weight: 400; }

  .header-controls { display: flex; gap: 8px; align-items: center; }

  .btn-new-chat {
    background: var(--accent-primary); color: #fff; border: 0;
    border-radius: 4px; padding: 6px 14px;
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.02em; white-space: nowrap;
    transition: background 0.15s;
  }
  .btn-new-chat:hover { background: var(--accent-primary-hover); }

  .model-select {
    background: transparent; color: var(--fg-dim);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 8px; font-family: var(--mono); font-size: 12px; cursor: pointer;
  }
  .model-select:focus { outline: none; border-color: var(--accent-primary); }
  .model-select option { background: var(--bg-card); }

  .btn-settings {
    background: transparent; color: var(--fg-muted);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 12px; font-size: 13px; cursor: pointer;
    font-family: var(--sans); white-space: nowrap;
    transition: border-color 0.15s, color 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-settings:hover { border-color: var(--accent-primary); color: var(--fg); }

  .key-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--fg-muted); flex-shrink: 0;
    transition: background 0.2s;
  }
  .key-dot.active { background: var(--accent-success); }

  /* ─── Settings modal ─────────────────────────────────────── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal-box {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 24px;
    min-width: 360px; max-width: 480px; width: 90vw;
  }
  .modal-box h2 {
    margin: 0 0 20px; font-size: 15px; font-weight: 600; color: var(--fg);
  }
  .modal-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .modal-field label {
    font-size: 11px; font-weight: 600; color: var(--fg-dim);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .modal-field .label-note { text-transform: none; font-weight: 400; color: var(--fg-muted); }
  .modal-field input {
    background: var(--bg-card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 10px; font-family: var(--mono); font-size: 13px;
  }
  .modal-field input:focus { outline: none; border-color: var(--accent-primary); }
  .modal-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
  .btn-done {
    background: var(--accent-primary); color: #fff; border: 0;
    border-radius: 4px; padding: 7px 20px;
    font-family: var(--sans); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-done:hover { background: var(--accent-primary-hover); }

  /* ─── Layout ─────────────────────────────────────────────── */
  main { flex: 1; width: 100%; padding: 32px 24px; }
  .transcript {
    max-width: 760px; width: 100%; margin: 0 auto;
    display: flex; flex-direction: column; gap: 32px;
  }

  /* ─── Fade-in ────────────────────────────────────────────── */
  @keyframes fadein {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
  .turn { animation: fadein 0.15s ease-out; }

  /* ─── User message ───────────────────────────────────────── */
  .turn.user .bubble {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    padding: 12px 16px; border-radius: 6px;
    font-family: var(--mono); font-size: 13px; color: var(--fg);
    white-space: pre-wrap; word-break: break-word;
  }

  /* ─── Tool block ─────────────────────────────────────────── */
  .tools {
    background: var(--bg-terminal);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent-primary);
    border-radius: 6px; padding: 12px 16px;
    font-family: var(--mono); font-size: 12.5px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .tools:empty { display: none; }

  .tool-call { display: flex; align-items: baseline; gap: 0; }
  .tool-call .arrow { color: var(--fg-muted); margin-right: 6px; flex-shrink: 0; }
  .tool-call .name  { color: var(--accent-primary); font-weight: 600; }
  .tool-call .args  { color: rgba(255,255,255,0.38); }

  .tool-result {
    padding-left: 20px;
    display: flex; align-items: baseline; gap: 6px;
  }
  .tool-result .glyph { flex-shrink: 0; }
  .tool-result.ok    .glyph { color: var(--accent-success); }
  .tool-result.empty .glyph { color: var(--fg-muted); }
  .tool-result.err   .glyph { color: var(--accent-error); }
  .tool-result.ok    .result-text { color: var(--fg-dim); }
  .tool-result.empty .result-text { color: var(--fg-muted); }
  .tool-result.err   .result-text {
    color: var(--accent-error);
    background: var(--accent-error-bg);
    padding: 1px 5px; border-radius: 3px;
  }

  /* ─── Answer (prose) ─────────────────────────────────────── */
  .answer {
    color: var(--fg); font-size: 15px; line-height: 1.65;
    word-break: break-word;
  }
  .answer:empty { display: none; }

  .answer h1 {
    font-size: 20px; font-weight: 600; color: var(--fg);
    margin: 32px 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .answer h2 {
    font-size: 17px; font-weight: 600; color: var(--fg);
    margin: 28px 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .answer h3 {
    font-size: 11px; font-weight: 600; color: var(--fg-dim);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin: 20px 0 6px;
  }
  .answer p { margin: 0 0 14px; }
  .answer p:last-child { margin-bottom: 0; }
  .answer strong { font-weight: 600; color: #fff; }
  .answer em { color: var(--fg-dim); font-style: italic; }

  .answer code {
    font-family: var(--mono); font-size: 0.88em;
    background: rgba(255,255,255,0.07); color: var(--fg);
    padding: 1px 5px; border-radius: 3px;
  }
  .answer pre {
    background: var(--bg-terminal); border: 1px solid var(--border);
    padding: 14px 16px; border-radius: 6px; overflow-x: auto;
    margin: 14px 0;
  }
  .answer pre code { background: transparent; padding: 0; font-size: 13px; }

  .answer a { color: var(--accent-primary); text-decoration: none; }
  .answer a:hover { text-decoration: underline; }
  .answer a[href^="http"]::after,
  .answer a[href^="https"]::after {
    content: "\00a0↗"; font-size: 0.78em; opacity: 0.55;
  }

  .answer ul, .answer ol { margin: 0 0 14px; padding-left: 24px; }
  .answer li { margin-bottom: 5px; }
  .answer li:last-child { margin-bottom: 0; }

  .answer table {
    width: 100%; border-collapse: collapse;
    margin: 14px 0; font-size: 14px;
  }
  .answer table th {
    color: var(--fg-muted); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 7px 14px; text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .answer table td {
    padding: 8px 14px; color: var(--fg);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: top;
  }
  .answer table tr:last-child td { border-bottom: none; }
  .answer table td:first-child { color: var(--fg-dim); font-weight: 500; width: 200px; }
  .answer table tr:nth-child(even) td { background: rgba(255,255,255,0.015); }

  /* ─── Numeric display ────────────────────────────────────── */
  .numeric-display {
    font-weight: 700; letter-spacing: -0.02em; color: var(--text-numeric);
  }

  /* ─── Footer / input ─────────────────────────────────────── */
  footer {
    padding: 12px 24px;
    border-top: 1px solid var(--border);
    background: var(--bg-card);
    flex-shrink: 0;
  }
  .input-row {
    display: flex; gap: 8px;
    max-width: 760px; margin: 0 auto;
  }
  .input-row input[type="text"] {
    flex: 1; background: var(--bg-elevated); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 14px; font-family: var(--mono); font-size: 14px;
    transition: border-color 0.15s;
  }
  .input-row input[type="text"]:focus { outline: none; border-color: var(--accent-primary); }
  .input-row button[type="submit"] {
    background: var(--accent-primary); color: #fff; border: 0; border-radius: 4px;
    padding: 0 22px; font-family: var(--sans); font-weight: 600; font-size: 14px;
    cursor: pointer; letter-spacing: 0.02em; transition: background 0.15s;
    white-space: nowrap;
  }
  .input-row button[type="submit"]:hover:not(:disabled) { background: var(--accent-primary-hover); }
  .input-row button[type="submit"]:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ─── Empty state ────────────────────────────────────────── */
  .empty-state {
    color: var(--fg-muted); font-size: 14px;
    text-align: center; padding: 64px 16px; line-height: 1.9;
    max-width: 760px; margin: 0 auto;
  }
</style>
</head>
<body>

<header>
  <p class="logo"><span class="brand">checkdocs</span> <span class="subtitle">· VulnCheck docs agent</span></p>
  <div class="header-controls">
    <button class="btn-new-chat" id="newchat">New chat</button>
    <select class="model-select" id="model" title="OpenRouter model">
      <option value="anthropic/claude-sonnet-4.5">claude-sonnet-4.5</option>
      <option value="anthropic/claude-opus-4.6">claude-opus-4.6</option>
      <option value="google/gemini-2.5-pro">gemini-2.5-pro</option>
      <option value="google/gemini-2.5-flash">gemini-2.5-flash</option>
      <option value="openai/gpt-4o-mini">gpt-4o-mini</option>
    </select>
    <button class="btn-settings" id="settings-btn">
      <span class="key-dot" id="key-dot"></span>Keys
    </button>
  </div>
</header>

<div class="modal-backdrop" id="settings-modal" hidden>
  <div class="modal-box">
    <h2>API Keys</h2>
    <div class="modal-field">
      <label>OpenRouter API Key</label>
      <input type="password" id="apikey" placeholder="sk-or-v1-..." autocomplete="off">
    </div>
    <div class="modal-field">
      <label>VulnCheck Token <span class="label-note">(optional — enables live API tools)</span></label>
      <input type="password" id="vctoken" placeholder="token..." autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn-done" id="settings-done">Done</button>
    </div>
  </div>
</div>

<main>
  <div id="transcript" class="transcript">
    <div class="empty-state">
      Click <strong>Keys</strong> to add your OpenRouter API key, then ask anything.<br>
      Try: <em>"Are there OPNsense vulnerabilities in the KEV?"</em>
      or <em>"Summarize Initial Access Intelligence."</em>
    </div>
  </div>
</main>

<footer>
  <form id="chatform">
    <div class="input-row">
      <input type="text" id="question" placeholder="Ask about VulnCheck docs and intelligence…" autocomplete="off" required>
      <button type="submit" id="submit">Send</button>
    </div>
  </form>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
(() => {
  const transcript   = document.getElementById('transcript');
  const form         = document.getElementById('chatform');
  const questionEl   = document.getElementById('question');
  const apikeyEl     = document.getElementById('apikey');
  const modelEl      = document.getElementById('model');
  const submitBtn    = document.getElementById('submit');
  const newChatBtn   = document.getElementById('newchat');
  const vctokenEl    = document.getElementById('vctoken');
  const settingsBtn  = document.getElementById('settings-btn');
  const settingsModal = document.getElementById('settings-modal');
  const settingsDone = document.getElementById('settings-done');
  const keyDot       = document.getElementById('key-dot');

  let currentSessionID = null;

  // Restore saved preferences.
  apikeyEl.value = sessionStorage.getItem('orkey') || '';
  modelEl.value  = sessionStorage.getItem('model') || modelEl.value;
  vctokenEl.value = sessionStorage.getItem('vctoken') || '';

  function updateKeyDot() {
    keyDot.classList.toggle('active', !!apikeyEl.value.trim());
  }
  updateKeyDot();

  apikeyEl.addEventListener('input', () => { sessionStorage.setItem('orkey', apikeyEl.value); updateKeyDot(); });
  modelEl.addEventListener('change', () => sessionStorage.setItem('model', modelEl.value));
  vctokenEl.addEventListener('input', () => sessionStorage.setItem('vctoken', vctokenEl.value));

  // Settings modal.
  settingsBtn.addEventListener('click', () => { settingsModal.hidden = false; apikeyEl.focus(); });
  settingsDone.addEventListener('click', () => { settingsModal.hidden = true; });
  settingsModal.addEventListener('click', e => { if (e.target === settingsModal) settingsModal.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') settingsModal.hidden = true; });

  newChatBtn.addEventListener('click', () => {
    currentSessionID = null;
    transcript.innerHTML = `<div class="empty-state">Click <strong>Keys</strong> to add your OpenRouter API key, then ask anything.<br>Try: <em>"Are there OPNsense vulnerabilities in the KEV?"</em> or <em>"Summarize Initial Access Intelligence."</em></div>`;
    questionEl.focus();
  });

  marked.setOptions({ breaks: true, gfm: true });

  // Insert a blank line before headings that don't already have one,
  // so mid-paragraph headings render correctly instead of bleeding through as ##.
  function normalizeMarkdown(md) {
    return md.replace(/([^\n])\n(#{1,6} )/g, '$1\n\n$2');
  }

  const RESEARCH_BASE = 'https://vulncheck-oss.github.io/vulnerability-research/';

  // Rewrite research:// hrefs to the publicly hosted MyST site.
  // research://path/to/file.ipynb → {RESEARCH_BASE}path/to/file
  function sanitizeResearchLinks(html) {
    return html.replace(/href="research:\/\/([^"]*)"/gi, (_, path) => {
      const url = RESEARCH_BASE + path.replace(/\.ipynb$/, '');
      return `href="${url}"`;
    });
  }

  function clearEmpty() {
    const e = transcript.querySelector('.empty-state');
    if (e) e.remove();
  }

  function addUserTurn(question) {
    clearEmpty();
    const turn = document.createElement('div');
    turn.className = 'turn user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = question;
    turn.appendChild(bubble);
    transcript.appendChild(turn);
  }

  // Classify a tool result into one of three states for semantic rendering.
  function resultState(result) {
    if (/^error/i.test(result) ||
        /requires a paid plan/i.test(result) ||
        /\b40[123]\b/.test(result) ||
        /coverage gap/i.test(result)) return 'err';
    if (/\bno results?\b|not in kev\b|not found\b|^0 pages\b|^no /i.test(result)) return 'empty';
    return 'ok';
  }

  const glyphs = { ok: '✓', empty: '○', err: '✗' };

  function addAssistantTurn() {
    const turn = document.createElement('div');
    turn.className = 'turn assistant';
    const tools = document.createElement('div');
    tools.className = 'tools';
    const answer = document.createElement('div');
    answer.className = 'answer';
    turn.appendChild(tools);
    turn.appendChild(answer);
    transcript.appendChild(turn);

    let raw = '';
    return {
      onToolCall(name, args) {
        // Wipe any pre-tool narration that streamed before this call.
        raw = ''; answer.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'tool-call';
        div.innerHTML =
          `<span class="arrow">→</span>` +
          `<span class="name">${esc(name)}</span>` +
          `<span class="args">(${esc(args)})</span>`;
        tools.appendChild(div);
      },
      onToolResult(_name, result) {
        const state = resultState(result);
        const div = document.createElement('div');
        div.className = `tool-result ${state}`;
        div.innerHTML =
          `<span class="glyph">${glyphs[state]}</span>` +
          `<span class="result-text">${esc(result)}</span>`;
        tools.appendChild(div);
      },
      onToken(text) {
        raw += text;
        answer.innerHTML = sanitizeResearchLinks(marked.parse(normalizeMarkdown(raw)));
      },
      onError(msg) {
        const div = document.createElement('div');
        div.className = 'tool-result err';
        div.innerHTML =
          `<span class="glyph">✗</span>` +
          `<span class="result-text">${esc(msg)}</span>`;
        tools.appendChild(div);
      },
    };
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = questionEl.value.trim();
    const apikey   = apikeyEl.value.trim();
    if (!question || !apikey) {
      if (!apikey) { settingsModal.hidden = false; apikeyEl.focus(); }
      return;
    }

    addUserTurn(question);
    const turn = addAssistantTurn();
    questionEl.value = '';
    submitBtn.disabled = true;

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type':    'application/json',
          'X-OpenRouter-Key': apikey,
          'X-VulnCheck-Token': vctokenEl.value.trim(),
        },
        body: JSON.stringify({ question, model: modelEl.value, session_id: currentSessionID }),
      });
      if (!resp.ok) {
        turn.onError(`HTTP ${resp.status}: ${await resp.text()}`);
        return;
      }

      // Manual SSE parsing — EventSource doesn't support custom headers.
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const events = buf.split('\n\n');
        buf = events.pop();
        for (const block of events) handleSSEBlock(block, turn);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
      }
    } catch (err) {
      turn.onError(err.message || String(err));
    } finally {
      submitBtn.disabled = false;
      questionEl.focus();
    }
  });

  function handleSSEBlock(block, turn) {
    let event = 'message', data = '';
    for (const line of block.split('\n')) {
      if (line.startsWith('event: ')) event = line.slice(7);
      else if (line.startsWith('data: ')) data += line.slice(6);
    }
    if (!data) return;
    let payload;
    try { payload = JSON.parse(data); } catch { return; }

    switch (event) {
      case 'session':     currentSessionID = payload.Content; break;
      case 'tool_call':   turn.onToolCall(payload.Name, payload.Args); break;
      case 'tool_result': turn.onToolResult(payload.Name, payload.Result); break;
      case 'token':       turn.onToken(payload.Content); break;
      case 'error':       turn.onError(payload.Content); break;
      case 'done':        break;
    }
  }
})();
</script>
</body>
</html>
